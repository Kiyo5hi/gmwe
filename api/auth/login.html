<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in | GMWE</title>
  <meta name="theme-color" content="#166345">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GMWE">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/pwa-180.png">
  <script src="/pwa.js" defer></script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #f5f7f6; color: #172821; }
    main { width: min(22rem, calc(100% - 3rem)); padding: 3rem 0; text-align: center; }
    img { width: 96px; height: 96px; object-fit: contain; }
    h1 { font-size: 2rem; margin: 1rem 0 2rem; letter-spacing: 0; }
    a { display: block; padding: 1rem; border-radius: 6px; background: #166345; color: white; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #cf7b20; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { body { background: #202622; color: #f0f5f1; } a { background: #256e4c; } }
  </style>
</head>
<body><main><img src="/gmwe.webp" alt=""><h1>GMWE</h1><a href="/api/auth/login">Sign in with Pocket-ID</a></main></body>
</html>
