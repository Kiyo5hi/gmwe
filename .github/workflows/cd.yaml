name: Continuous Delivery

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kiyo5hi/gmwe

jobs:
  client:
    name: Validate static client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build and check types
        working-directory: client
        run: npm ci && npm run check && npm run build
      - name: Install browser engines
        working-directory: client
        run: npx playwright install --with-deps chromium webkit
      - name: Check navigation, writes and mobile layouts
        working-directory: client
        run: npm run test:browser

  build-and-push-image:
    name: Build and Push to ghcr.io
    needs: client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Test API and check reachable vulnerabilities
        run: |
          go test ./api/...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./api/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: ./deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
