name: Continuous Delivery

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kiyo5hi/gmwe

jobs:
  client:
    name: Validate static client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build and check types
        working-directory: client
        run: npm ci && npm run check && npm run build
      - name: Install browser engines
        working-directory: client
        run: npx playwright install --with-deps chromium webkit
      - name: Check navigation, writes and mobile layouts
        working-directory: client
        run: npm run test:browser

  build-and-push-image:
    name: Validate image and publish main
    needs: client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: github.event_name == 'push'
        uses: docker/setup-qemu-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          check-latest: true

      - name: Test API and check reachable vulnerabilities
        run: |
          go test ./api/...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./api/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          file: ./deploy/Dockerfile
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha,scope=gmwe-image,version=2
          cache-to: type=gha,scope=gmwe-image,version=2,mode=max
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Verify frontend edits reuse the Go build
        if: github.event_name == 'pull_request'
        run: |
          # Imported remote cache records are scoped to the preceding solve.
          # Establish a local API baseline before testing a frontend-only edit.
          docker buildx build --platform linux/amd64 --target api_build \
            --output type=cacheonly --progress=plain -f deploy/Dockerfile .
          trap 'git restore client/styles.css' EXIT
          printf '\n/* build cache probe */\n' >> client/styles.css
          docker buildx build --platform linux/amd64 --target api_build \
            --output type=cacheonly --progress=plain -f deploy/Dockerfile . \
            2>&1 | tee /tmp/gmwe-api-cache.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/gmwe-api-cache.log').read_text()
          step = re.search(r'(#[0-9]+) .*RUN go test ./api/', log)
          assert step and f'{step[1]} CACHED' in log, 'Frontend edit rebuilt the API'
          print('PASS frontend edit reused the tested Go binaries')
          PY
